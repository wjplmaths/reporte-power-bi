<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Fondo de pagina de analisis con zonas para tarjetas y graficos">
  <defs>
    <filter id="sombra" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <style>
      .zona   { fill: #FFFFFF; stroke: #E1E5EA; stroke-width: 1; filter: url(#sombra); }
      .filtro { fill: #FFFFFF; stroke: #E1E5EA; stroke-width: 1; filter: url(#sombra); }
    </style>
  </defs>
  <!-- Fondo de pagina: gris muy claro, igual que el tema -->
  <rect width="1280" height="720" fill="#F3F4F6"/>
  <!-- Fila 1: segmentaciones (anio y mes) -->
  <rect class="filtro" x="20"  y="16" width="500" height="72" rx="8"/>
  <rect class="filtro" x="530" y="16" width="730" height="72" rx="8"/>
  <!-- Fila 2: tres tarjetas (200 x 110 con icono a la izquierda) -->
  <rect class="zona" x="20"  y="98" width="300" height="110" rx="8"/>
  <rect class="zona" x="330" y="98" width="300" height="110" rx="8"/>
  <rect class="zona" x="640" y="98" width="300" height="110" rx="8"/>
  <!-- Franja de acento superior de cada tarjeta -->
  <rect x="20"  y="98" width="300" height="4" rx="2" fill="#56B4E9"/>
  <rect x="330" y="98" width="300" height="4" rx="2" fill="#E69F00"/>
  <rect x="640" y="98" width="300" height="4" rx="2" fill="#009E73"/>
  <!-- Zona derecha: medidor y grafico de barras -->
  <rect class="zona" x="950" y="98"  width="310" height="185" rx="8"/>
  <rect class="zona" x="950" y="293" width="310" height="407" rx="8"/>
  <!-- Fila 3: mapa y tabla -->
  <rect class="zona" x="20"  y="218" width="380" height="482" rx="8"/>
  <rect class="zona" x="410" y="218" width="530" height="482" rx="8"/>
  <!-- Banda inferior libre para la navegacion -->
  <rect x="0" y="708" width="1280" height="12" fill="#1F3864"/>
  <rect x="0" y="708" width="426" height="12" fill="#56B4E9"/>
  <rect x="426" y="708" width="427" height="12" fill="#009E73"/>
</svg>