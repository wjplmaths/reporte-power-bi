<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Fondo de portada">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F3864"/>
      <stop offset="1" stop-color="#0F1C33"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56B4E9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#56B4E9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#56B4E9" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- Circulos decorativos en las esquinas (la zona central queda libre para logo, titulo y boton) -->
  <circle cx="-40" cy="-30" r="260" fill="#56B4E9" fill-opacity="0.14"/>
  <circle cx="90" cy="130" r="110" fill="#56B4E9" fill-opacity="0.12"/>
  <circle cx="1300" cy="740" r="300" fill="#E69F00" fill-opacity="0.12"/>
  <circle cx="1180" cy="610" r="120" fill="#E69F00" fill-opacity="0.14"/>
  <!-- Barras ascendentes (motivo de ventas) abajo a la izquierda -->
  <g fill="#56B4E9">
    <rect x="60"  y="600" width="34" height="60"  rx="4" fill-opacity="0.35"/>
    <rect x="108" y="570" width="34" height="90"  rx="4" fill-opacity="0.45"/>
    <rect x="156" y="535" width="34" height="125" rx="4" fill-opacity="0.55"/>
    <rect x="204" y="495" width="34" height="165" rx="4" fill-opacity="0.65"/>
  </g>
  <polyline points="77,585 125,555 173,520 221,478" fill="none" stroke="#009E73" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
  <circle cx="221" cy="478" r="8" fill="#009E73"/>
  <!-- Banda luminosa y linea de acento -->
  <rect x="0" y="672" width="1280" height="3" fill="url(#band)"/>
  <rect x="0" y="708" width="1280" height="12" fill="#E69F00" fill-opacity="0.9"/>
  <rect x="0" y="708" width="426" height="12" fill="#56B4E9"/>
  <rect x="426" y="708" width="427" height="12" fill="#009E73"/>
</svg>